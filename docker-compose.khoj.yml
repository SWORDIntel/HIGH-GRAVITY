services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: khoj
      POSTGRES_DB: khoj
    command: ["postgres", "-c", "listen_addresses=*", "-c", "unix_socket_directories="]
    volumes:
      - khoj_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U khoj"]
      interval: 5s
      timeout: 5s
      retries: 10

  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "42110:42110"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: khoj
      POSTGRES_DB: khoj
      KHOJ_ADMIN_EMAIL: admin@local
      KHOJ_ADMIN_PASSWORD: admin123
    volumes:
      - /home/john/HIGH-GRAVITY:/workspace:ro
      - khoj_data:/root/.khoj

volumes:
  khoj_pg:
  khoj_data:
